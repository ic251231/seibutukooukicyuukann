<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物と環境 後期中間試験対策クイズ</title>
<style>
  :root {
    --primary: #2e7d32;
    --primary-light: #e8f5e9;
    --primary-dark: #1b5e20;
    --accent: #0288d1;
    --correct: #2e7d32;
    --correct-bg: #c8e6c9;
    --wrong: #c62828;
    --wrong-bg: #ffcdd2;
    --bg: #f4f7f4;
    --card-bg: #ffffff;
    --text: #263238;
    --text-sub: #546e7a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 12px;
  }

  .container {
    width: 100%;
    max-width: 680px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 20px 24px;
    text-align: center;
  }

  header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  header p {
    font-size: 0.85rem;
    opacity: 0.9;
    margin-top: 4px;
  }

  .screen {
    display: none;
    padding: 24px;
  }

  .screen.active {
    display: block;
    animation: fadeIn 0.25s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 設定画面 */
  .section-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 18px;
    background: var(--primary);
    border-radius: 3px;
  }

  .option-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .select-btn {
    padding: 14px 12px;
    border: 2px solid #cfd8dc;
    background: #fff;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .select-btn span {
    display: block;
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--text-sub);
    margin-top: 4px;
  }

  .select-btn:hover {
    border-color: var(--primary);
    background: #f9fbe7;
  }

  .select-btn.selected {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary-dark);
    box-shadow: 0 2px 8px rgba(46, 125, 50, 0.2);
  }

  .start-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
  }

  .start-btn:hover {
    background: var(--primary-dark);
  }

  .start-btn:active {
    transform: scale(0.99);
  }

  /* クイズ画面（フラッシュカード） */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.9rem;
    color: var(--text-sub);
    font-weight: 600;
  }

  .badge {
    background: var(--primary-light);
    color: var(--primary-dark);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .progress-bar {
    width: 100%;
    height: 8px;
    background: #eceff1;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .progress-fill {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s ease;
  }

  .flashcard {
    background: #fafafa;
    border: 2px solid #e0e0e0;
    border-radius: 14px;
    padding: 22px 20px;
    margin-bottom: 20px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  .question-text {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.65;
  }

  .choices-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .choice-btn {
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    background: #fff;
    border: 2px solid #cfd8dc;
    border-radius: 10px;
    font-size: 0.98rem;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
  }

  .choice-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .choice-num {
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #eceff1;
    color: var(--text-sub);
    display: inline-flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .choice-btn.correct {
    background: var(--correct-bg) !important;
    border-color: var(--correct) !important;
    color: #1b5e20 !important;
    font-weight: 700;
  }

  .choice-btn.correct .choice-num {
    background: var(--correct);
    color: #fff;
  }

  .choice-btn.wrong {
    background: var(--wrong-bg) !important;
    border-color: var(--wrong) !important;
    color: #b71c1c !important;
    font-weight: 700;
  }

  .choice-btn.wrong .choice-num {
    background: var(--wrong);
    color: #fff;
  }

  /* 結果＆復習画面 */
  .score-card {
    text-align: center;
    padding: 24px 16px;
    background: var(--primary-light);
    border-radius: 14px;
    margin-bottom: 24px;
  }

  .score-title {
    font-size: 1rem;
    color: var(--primary-dark);
    font-weight: 700;
  }

  .score-num {
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--primary-dark);
    margin: 8px 0;
  }

  .score-sub {
    font-size: 0.9rem;
    color: var(--text-sub);
  }

  .review-filter {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .filter-btn {
    flex: 1;
    padding: 10px;
    border: 1.5px solid #cfd8dc;
    background: #fff;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    color: var(--text-sub);
  }

  .filter-btn.active {
    border-color: var(--primary);
    background: var(--primary);
    color: #fff;
  }

  .review-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 24px;
  }

  .review-item {
    border: 1.5px solid #e0e0e0;
    border-radius: 12px;
    padding: 16px;
    background: #fff;
  }

  .review-item.is-wrong {
    border-left: 6px solid var(--wrong);
  }

  .review-item.is-correct {
    border-left: 6px solid var(--correct);
  }

  .review-q-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.82rem;
  }

  .status-tag {
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 700;
  }

  .status-tag.ng {
    background: var(--wrong-bg);
    color: var(--wrong);
  }

  .status-tag.ok {
    background: var(--correct-bg);
    color: var(--correct);
  }

  .review-q-text {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 12px;
  }

  .ans-box {
    background: #f5f7f8;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }

  .ans-row {
    margin: 4px 0;
  }

  .ans-row.user-ng {
    color: var(--wrong);
    font-weight: 700;
  }

  .ans-row.correct-ans {
    color: var(--correct);
    font-weight: 700;
  }

  .exp-box {
    font-size: 0.9rem;
    color: var(--text);
    border-top: 1px dashed #cfd8dc;
    padding-top: 10px;
    margin-top: 8px;
  }

  .source-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--accent);
    background: #e1f5fe;
    padding: 3px 10px;
    border-radius: 6px;
    font-weight: 700;
  }

  .btn-group {
    display: flex;
    gap: 12px;
  }

  .sub-btn {
    flex: 1;
    padding: 14px;
    background: #eceff1;
    color: var(--text);
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  .sub-btn:hover {
    background: #cfd8dc;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>生物と環境 試験対策フラッシュカード</h1>
    <p>後期中間試験対策プリント（50問）＋ 授業プリント・資料（20問）</p>
  </header>

  <!-- 1. スタート・モード選択画面 -->
  <div id="start-screen" class="screen active">
    <div class="section-title">問題数モードを選択</div>
    <div class="option-grid" id="count-options">
      <button class="select-btn selected" data-count="10">10問モード<span>サクッと確認（対策7問＋授業3問）</span></button>
      <button class="select-btn" data-count="30">30問モード<span>標準演習（対策21問＋授業9問）</span></button>
      <button class="select-btn" data-count="60">60問モード<span>徹底演習（対策43問＋授業17問）</span></button>
      <button class="select-btn" data-count="70">全問モード（70問）<span>対策50問＋授業20問すべて</span></button>
    </div>

    <div class="section-title">出題順を選択</div>
    <div class="option-grid" id="order-options">
      <button class="select-btn selected" data-random="true">ランダム出題<span>毎回シャッフルして出題</span></button>
      <button class="select-btn" data-random="false">ランダム無し<span>プリントの問1から順番に出題</span></button>
    </div>

    <button class="start-btn" id="start-btn">クイズをスタート</button>
  </div>

  <!-- 2. クイズ画面 -->
  <div id="quiz-screen" class="screen">
    <div class="quiz-header">
      <span id="q-counter">第 1 / 10 問</span>
      <span class="badge" id="q-category">試験対策プリント</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="flashcard">
      <div class="question-text" id="question-text">ここに問題文が表示されます</div>
    </div>

    <div class="choices-list" id="choices-list"></div>
  </div>

  <!-- 3. 結果・復習画面 -->
  <div id="result-screen" class="screen">
    <div class="score-card">
      <div class="score-title">クイズ結果</div>
      <div class="score-num" id="score-num">8 / 10</div>
      <div class="score-sub" id="score-rate">正答率 80%</div>
    </div>

    <div class="section-title">問題の復習（解説と出典）</div>
    <div class="review-filter">
      <button class="filter-btn active" id="filter-wrong">間違えた問題のみ</button>
      <button class="filter-btn" id="filter-all">全問題を表示</button>
    </div>

    <div class="review-list" id="review-list"></div>

    <div class="btn-group">
      <button class="sub-btn" id="retry-wrong-btn" style="display:none; background:#ffecb3; color:#e65100;">間違えた問題だけ再挑戦</button>
      <button class="start-btn" id="back-home-btn" style="flex:1;">トップに戻る</button>
    </div>
  </div>
</div>

<script>
// 全70問データ（試験対策プリント50問＝約71.4% ＋ 授業プリント・授業資料20問＝約28.6%）
const ALL_QUESTIONS = [
  // ================= 後期中間試験対策プリント（問1〜問50） =================
  {
    id: 1, type: "exam",
    q: "問1：池の生物、水温、底の泥と、それらの関係を一体として調べた。調べた対象は何か。",
    choices: ["生態系", "個体群", "バイオーム", "植生", "優占種"],
    ans: "生態系",
    exp: "ある環境における全ての生物的環境（バイオーム）と、それを取り巻く非生物的環境（水温・底の泥などの環境要因）を合わせた総体を「生態系」といいます。",
    source: "後期中間試験対策プリント 1ページ 問1（第17回授業プリント・第17回授業資料）"
  },
  {
    id: 2, type: "exam",
    q: "問2：植物にとって非生物的な環境要因に当たるものはどれか。",
    choices: ["土壌中の水分", "根に共生する菌", "葉を食べる昆虫", "落葉を分解する菌", "隣に生える樹木"],
    ans: "土壌中の水分",
    exp: "光・大気・土壌・気温・水（水分）などは「非生物的環境（環境要因）」に分類されます。他の菌や昆虫、樹木は「生物的環境」です。",
    source: "後期中間試験対策プリント 1ページ 問2（第17回授業プリント・第17回授業資料）"
  },
  {
    id: 3, type: "exam",
    q: "問3：種名が分からない段階で、遠景から森林・草原・荒原を区別した。これは何に基づく分類か。",
    choices: ["植生の相観", "植物の種構成", "樹種の優占度", "各種の被度", "植物の生活形"],
    ans: "植生の相観",
    exp: "植生の外観（全体の見た目）によって森林・草原・荒原などに分ける方法を「相観による分類」といいます。",
    source: "後期中間試験対策プリント 1ページ 問3（第17回授業プリント・第17回授業資料）"
  },
  {
    id: 4, type: "exam",
    q: "問4：草本が光合成でつくった有機物を、草食昆虫が食べ、落葉は菌類が分解する。草本・昆虫・菌類の役割の順として正しいものはどれか。",
    choices: ["生産者・消費者・分解者", "生産者・分解者・消費者", "分解者・消費者・生産者", "消費者・生産者・分解者", "消費者・分解者・生産者"],
    ans: "生産者・消費者・分解者",
    exp: "光合成で有機物をつくる植物（草本）は「生産者」、それを食べる動物（草食昆虫）は「消費者」、遺骸や落葉を分解する微生物・菌類は「分解者」です。",
    source: "後期中間試験対策プリント 1ページ 問4（第17回授業プリント・第17回授業資料）"
  },
  {
    id: 5, type: "exam",
    q: "問5：「環境」の定義において、〇〇に入る語句は何か。『〇〇が認識し、〇〇に影響を与えるものを環境という。』",
    choices: ["主体", "優占種", "生活形", "環境要因", "植生"],
    ans: "主体",
    exp: "環境（Environment）とは、「主体に影響を与え、主体が認識するもの」と定義されます。主体とは人間を含む生物個体や生物集団を指します。",
    source: "後期中間試験対策プリント 1ページ 問5（第17回授業プリント・第17回授業資料）"
  },
  {
    id: 6, type: "exam",
    q: "問6：ある地域の環境に適応し、まとまりをなしている生物の集まりを表す用語はどれか。",
    choices: ["バイオーム", "個体群", "優占種", "相観", "生態系"],
    ans: "バイオーム",
    exp: "ある地域の環境に適応した生物集団全体のことを「バイオーム（生物群系）」といいます（Bio＝生物 ＋ Ome＝全体）。",
    source: "後期中間試験対策プリント 1ページ 問6（第17回授業プリント・第17回授業資料）"
  },
  {
    id: 7, type: "exam",
    q: "問7：森林の階層構造を上から順に並べたものはどれか。",
    choices: [
      "高木層→亜高木層→低木層→草本層",
      "高木層→亜高木層→草本層→低木層",
      "亜高木層→低木層→高木層→草本層",
      "高木層→低木層→亜高木層→草本層",
      "亜高木層→高木層→低木層→草本層"
    ],
    ans: "高木層→亜高木層→低木層→草本層",
    exp: "森林の階層構造は、高い方から順に「高木層 → 亜高木層 → 低木層 → 草本層（→地表層）」と分かれています。",
    source: "後期中間試験対策プリント 1ページ 問7（第19回授業プリント）"
  },
  {
    id: 8, type: "exam",
    q: "問8：高木の枝葉が光を遮り、林床が暗くなった。この関係を表すものはどれか。",
    choices: [
      "生物が環境に影響した",
      "環境要因どうしが影響した",
      "生物どうしが互いに影響した",
      "環境が生物に影響した",
      "環境が自ら変化した"
    ],
    ans: "生物が環境に影響した",
    exp: "高木（生物）が光を遮ることで林床の光環境（非生物的環境）を暗く変化させているため、「生物が環境に影響した（環境形成作用）」にあたります。",
    source: "後期中間試験対策プリント 1ページ 問8（第18回・第19回授業プリント）"
  },
  {
    id: 9, type: "exam",
    q: "問9：隣り合う二本の木が、互いの枝葉で相手に届く光を奪い合っている。この関係を表した語句は次のうちどれか。",
    choices: ["相互作用", "生活形", "作用", "光合成", "環境形成作用"],
    ans: "相互作用",
    exp: "生物どうしが互いに影響しあうことを「相互作用」といいます（環境→生物は「作用」、生物→環境は「環境形成作用」）。",
    source: "後期中間試験対策プリント 1ページ 問9（第19回授業プリント）"
  },
  {
    id: 10, type: "exam",
    q: "問10：葉が光合成に使い、呼吸で放出する気体はどれか。",
    choices: ["二酸化炭素", "酸素", "窒素", "メタン", "水蒸気"],
    ans: "二酸化炭素",
    exp: "植物は光合成で「水＋二酸化炭素＋光エネルギー → 有機物＋酸素」をつくり、呼吸で「酸素＋有機物 → 二酸化炭素＋水＋エネルギー」を放出します。",
    source: "後期中間試験対策プリント 1ページ 問10（第18回・第19回授業プリント）"
  },
  {
    id: 11, type: "exam",
    q: "問11：光合成による二酸化炭素吸収量が毎時8、呼吸による放出が毎時3だった。見かけの二酸化炭素吸収量は毎時いくらか。",
    choices: ["5", "2.7", "11", "3", "8"],
    ans: "5",
    exp: "「見かけの光合成速度（二酸化炭素吸収量）＝ 実際の光合成速度(8) － 呼吸速度(3) ＝ 5」となります。",
    source: "後期中間試験対策プリント 1ページ 問11（第18回授業プリント）"
  },
  {
    id: 12, type: "exam",
    q: "問12：ある植物の葉に、光補償点よりわずかに弱い光が当たっているとき、二酸化炭素の出入りはどうなるか。",

// 状態管理
let selectedCount = 10;
let isRandomOrder = true;
let currentQuizList = [];
let currentIndex = 0;
let userLogs = [];
let isLocked = false;
let currentFilter = "wrong";

// 要素の取得
const startScreen = document.getElementById("start-screen");
const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");

// モードボタンのイベント設定
document.querySelectorAll("#count-options .select-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#count-options .select-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedCount = parseInt(btn.dataset.count, 10);
  });
});

document.querySelectorAll("#order-options .select-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#order-options .select-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    isRandomOrder = btn.dataset.random === "true";
  });
});

// 配列シャッフル関数
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// 問題リストの作成（常に試験対策PDFから約7割出題）
function buildQuizList(count, randomFlag) {
  const examQuestions = ALL_QUESTIONS.filter(q => q.type === "exam"); // 50問
  const printQuestions = ALL_QUESTIONS.filter(q => q.type === "print"); // 20問

  if (count >= ALL_QUESTIONS.length) {
    // 全問モード（70問：対策50問＝71.4%、授業20問＝28.6%）
    const all = [...examQuestions, ...printQuestions];
    return randomFlag ? shuffleArray(all) : all;
  }

  // 約7割を試験対策プリントから、残り約3割を授業プリントから抽出
  let examTarget = Math.round(count * 0.7);
  if (examTarget > examQuestions.length) examTarget = examQuestions.length;
  let printTarget = count - examTarget;
  if (printTarget > printQuestions.length) {
    printTarget = printQuestions.length;
    examTarget = count - printTarget;
  }

  if (randomFlag) {
    const pickedExam = shuffleArray(examQuestions).slice(0, examTarget);
    const pickedPrint = shuffleArray(printQuestions).slice(0, printTarget);
    return shuffleArray([...pickedExam, ...pickedPrint]);
  } else {
    // ランダム無し：問1から順番に指定数を取得
    const pickedExam = examQuestions.slice(0, examTarget);
    const pickedPrint = printQuestions.slice(0, printTarget);
    return [...pickedExam, ...pickedPrint];
  }
}

// クイズ開始
document.getElementById("start-btn").addEventListener("click", () => {
  currentQuizList = buildQuizList(selectedCount, isRandomOrder);
  startQuizSession(currentQuizList);
});

function startQuizSession(list) {
  currentIndex = 0;
  userLogs = [];
  isLocked = false;
  startScreen.classList.remove("active");
  resultScreen.classList.remove("active");
  quizScreen.classList.add("active");
  renderQuestion();
}

// 問題の描画
function renderQuestion() {
  isLocked = false;
  const qData = currentQuizList[currentIndex];
  const total = currentQuizList.length;

  document.getElementById("q-counter").textContent = `第 ${currentIndex + 1} / ${total} 問`;
  const badge = document.getElementById("q-category");
  if (qData.type === "exam") {
    badge.textContent = "試験対策プリント";
    badge.style.background = "#e8f5e9";
    badge.style.color = "#1b5e20";
  } else {
    badge.textContent = "授業プリント・資料";
    badge.style.background = "#e1f5fe";
    badge.style.color = "#01579b";
  }

  const progressPercent = ((currentIndex) / total) * 100;
  document.getElementById("progress-fill").style.width = `${progressPercent}%`;

  document.getElementById("question-text").textContent = qData.q;

  // 5つの選択肢を毎回ランダムにシャッフル
  const shuffledChoices = shuffleArray(qData.choices);
  const choicesContainer = document.getElementById("choices-list");
  choicesContainer.innerHTML = "";

  const labels = ["①", "②", "③", "④", "⑤"];
  shuffledChoices.forEach((choiceText, idx) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="choice-num">${labels[idx]}</span><span>${choiceText}</span>`;
    btn.addEventListener("click", () => handleAnswer(btn, choiceText, qData));
    choicesContainer.appendChild(btn);
  });
}

// 回答時の処理（0.5秒待って自動的に次の問題へ）
function handleAnswer(selectedBtn, chosenText, qData) {
  if (isLocked) return;
  isLocked = true;

  const isCorrect = (chosenText === qData.ans);
  const allButtons = document.querySelectorAll("#choices-list .choice-btn");

  allButtons.forEach(btn => {
    btn.disabled = true;
    const text = btn.querySelector("span:last-child").textContent;
    if (text === qData.ans) {
      btn.classList.add("correct");
    }
  });

  if (!isCorrect) {
    selectedBtn.classList.add("wrong");
  }

  // 履歴を保存
  userLogs.push({
    qData: qData,
    userAns: chosenText,
    isCorrect: isCorrect
  });

  // プログレスバー更新
  const total = currentQuizList.length;
  document.getElementById("progress-fill").style.width = `${((currentIndex + 1) / total) * 100}%`;

  // 0.5秒（500ミリ秒）待って自動的に次の問題へ遷移
  setTimeout(() => {
    currentIndex++;
    if (currentIndex < currentQuizList.length) {
      renderQuestion();
    } else {
      showResultScreen();
    }
  }, 500);
}

// 結果・復習画面の表示
function showResultScreen() {
  quizScreen.classList.remove("active");
  resultScreen.classList.add("active");

  const total = userLogs.length;
  const correctCount = userLogs.filter(log => log.isCorrect).length;
  const wrongCount = total - correctCount;
  const rate = Math.round((correctCount / total) * 100);

  document.getElementById("score-num").textContent = `${correctCount} / ${total}`;
  document.getElementById("score-rate").textContent = `正答率 ${rate}%（正解 ${correctCount}問 / 不正解 ${wrongCount}問）`;

  const retryWrongBtn = document.getElementById("retry-wrong-btn");
  if (wrongCount > 0) {
    retryWrongBtn.style.display = "block";
    currentFilter = "wrong";
    document.getElementById("filter-wrong").classList.add("active");
    document.getElementById("filter-all").classList.remove("active");
  } else {
    retryWrongBtn.style.display = "none";
    currentFilter = "all";
    document.getElementById("filter-wrong").classList.remove("active");
    document.getElementById("filter-all").classList.add("active");
  }

  renderReviewList();
}

// 復習リストの描画
function renderReviewList() {
  const container = document.getElementById("review-list");
  container.innerHTML = "";

  const targetLogs = currentFilter === "wrong"
    ? userLogs.filter(log => !log.isCorrect)
    : userLogs;

  if (targetLogs.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:24px; color:#2e7d32; font-weight:700;">🎉 間違えた問題はありません！全問正解です！「全問題を表示」からすべての解説を確認できます。</div>`;
    return;
  }

  targetLogs.forEach((log, idx) => {
    const item = document.createElement("div");
    item.className = `review-item ${log.isCorrect ? "is-correct" : "is-wrong"}`;

    item.innerHTML = `
      <div class="review-q-head">
        <span class="status-tag ${log.isCorrect ? "ok" : "ng"}">${log.isCorrect ? "〇 正解" : "× 不正解"}</span>
        <span style="color:#546e7a; font-weight:700;">問題ID: #${log.qData.id}</span>
      </div>
      <div class="review-q-text">${log.qData.q}</div>
      <div class="ans-box">
        <div class="ans-row ${log.isCorrect ? "correct-ans" : "user-ng"}">あなたの解答：${log.userAns}</div>
        ${!log.isCorrect ? `<div class="ans-row correct-ans">正解：${log.qData.ans}</div>` : ""}
      </div>
      <div class="exp-box">
        <strong>【解説】</strong><br>${log.qData.exp}<br>
        <span class="source-tag">出典：${log.qData.source}</span>
      </div>
    `;
    container.appendChild(item);
  });
}

// フィルター切り替え
document.getElementById("filter-wrong").addEventListener("click", () => {
  currentFilter = "wrong";
  document.getElementById("filter-wrong").classList.add("active");
  document.getElementById("filter-all").classList.remove("active");
  renderReviewList();
});

document.getElementById("filter-all").addEventListener("click", () => {
  currentFilter = "all";
  document.getElementById("filter-all").classList.add("active");
  document.getElementById("filter-wrong").classList.remove("active");
  renderReviewList();
});

// 間違えた問題だけ再挑戦
document.getElementById("retry-wrong-btn").addEventListener("click", () => {
  const wrongQuestions = userLogs.filter(log => !log.isCorrect).map(log => log.qData);
  currentQuizList = isRandomOrder ? shuffleArray(wrongQuestions) : wrongQuestions;
  startQuizSession(currentQuizList);
});

// トップに戻る
document.getElementById("back-home-btn").addEventListener("click", () => {
  resultScreen.classList.remove("active");
  startScreen.classList.add("active");
});
</script>
